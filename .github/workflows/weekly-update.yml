name: Lens Social Radar Weekly Update

on:
  workflow_dispatch:
    inputs:
      collection_mode:
        description: "Collection mode"
        required: true
        default: "apify"
        type: choice
        options:
          - apify
          - demo
          - incoming
  schedule:
    # Every Monday at 09:00 China Standard Time (01:00 UTC)
    - cron: "0 1 * * 1"

permissions:
  contents: write

jobs:
  weekly-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install video analysis tools
        if: ${{ vars.CREATIVE_ANALYSIS_ENABLED == 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Build weekly radar data
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CREATIVE_MODEL: ${{ vars.OPENAI_CREATIVE_MODEL || 'gpt-5.6-sol' }}
          CREATIVE_ANALYSIS_ENABLED: ${{ vars.CREATIVE_ANALYSIS_ENABLED || 'false' }}
          APIFY_RESULTS_PER_QUERY: ${{ vars.APIFY_RESULTS_PER_QUERY || '5' }}
          MANUAL_MODE: ${{ github.event.inputs.collection_mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$MANUAL_MODE" ]; then
            MODE="$MANUAL_MODE"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            MODE="apify"
          else
            MODE="demo"
          fi
          echo "Collection mode: $MODE"
          python scripts/weekly_update.py --mode "$MODE"

      - name: Commit updated weekly data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/media 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore: update weekly social radar"
            git push
          fi
