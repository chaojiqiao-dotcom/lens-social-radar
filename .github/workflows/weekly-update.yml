name: Lens Social Radar Weekly Update

on:
  workflow_dispatch:
    inputs:
      collection_mode:
        description: "Collection mode"
        required: true
        default: "demo"
        type: choice
        options:
          - demo
          - apify
          - incoming
  schedule:
    # Every Monday at 09:00 China Standard Time (01:00 UTC)
    - cron: "0 1 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/weekly-update.yml"

permissions:
  contents: write

jobs:
  weekly-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build weekly radar data
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COLLECTION_MODE_VAR: ${{ vars.COLLECTION_MODE }}
          APIFY_RESULTS_PER_QUERY: ${{ vars.APIFY_RESULTS_PER_QUERY || '10' }}
          MANUAL_MODE: ${{ github.event.inputs.collection_mode }}
        run: |
          if [ -n "$MANUAL_MODE" ]; then
            MODE="$MANUAL_MODE"
          elif [ -n "$COLLECTION_MODE_VAR" ]; then
            MODE="$COLLECTION_MODE_VAR"
          else
            MODE="demo"
          fi
          echo "Collection mode: $MODE"
          python scripts/weekly_update.py --mode "$MODE"

      - name: Commit updated weekly data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/media 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore: update weekly social radar"
            git push
          fi
